<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Cloud Notepad (GitHub)</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #121212;
      color: #ffffff;
      padding: 20px;
    }

    h1 {
      text-align: center;
    }

    input, textarea, button {
      width: 100%;
      margin-top: 10px;
      padding: 10px;
      font-size: 16px;
    }

    textarea {
      height: 300px;
      resize: vertical;
    }

    button {
      background: #1f6feb;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    button:hover {
      background: #388bfd;
    }

    #status {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<h1>📝 Cloud Notepad (GitHub Storage)</h1>

<input type="text" id="filename" placeholder="Enter file name (e.g. notes.txt)" />

<textarea id="content" placeholder="Write your notes here..."></textarea>

<button onclick="loadFile()">Load File</button>
<button onclick="saveFile()">Save File</button>
<button onclick="clearText()">Clear Text</button>

<div id="status"></div>

<script>
  // ===== GITHUB CONFIGURATION =====
  const OWNER = "FrankCagadas";
  const REPO = "CC106";
  const BRANCH = "main";

  // GitHub Personal Access Token (required)
  const TOKEN = "ghp_xxxxxxxxxxxxxxxxxxxxxxxxxxxxx";

  const statusEl = document.getElementById("status");

  function setStatus(message, success = true) {
    statusEl.textContent = message;
    statusEl.style.color = success ? "lightgreen" : "salmon";
  }

  function getApiUrl(filename) {
    return `https://api.github.com/repos/${OWNER}/${REPO}/contents/${filename}`;
  }

  async function loadFile() {
    const filename = document.getElementById("filename").value.trim();
    if (!filename) {
      setStatus("Please enter a file name.", false);
      return;
    }

    try {
      const response = await fetch(getApiUrl(filename), {
        headers: { Authorization: `token ${TOKEN}` }
      });

      if (!response.ok) throw new Error("File not found.");

      const data = await response.json();
      const content = atob(data.content.replace(/\n/g, ""));
      document.getElementById("content").value = content;

      setStatus("File loaded successfully.");
    } catch (err) {
      setStatus(err.message, false);
    }
  }

  async function saveFile() {
    const filename = document.getElementById("filename").value.trim();
    const content = document.getElementById("content").value;

    if (!filename) {
      setStatus("Please enter a file name.", false);
      return;
    }

    try {
      let sha = null;

      const check = await fetch(getApiUrl(filename), {
        headers: { Authorization: `token ${TOKEN}` }
      });

      if (check.ok) {
        const data = await check.json();
        sha = data.sha;
      }

      const response = await fetch(getApiUrl(filename), {
        method: "PUT",
        headers: {
          Authorization: `token ${TOKEN}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          message: `Update ${filename}`,
          content: btoa(content),
          branch: BRANCH,
          sha: sha
        })
      });

      if (!response.ok) throw new Error("Failed to save file.");

      setStatus("File saved successfully.");
    } catch (err) {
      setStatus(err.message, false);
    }
  }

  function clearText() {
    document.getElementById("content").value = "";
    setStatus("Text cleared.");
  }
</script>

</body>
</html>
